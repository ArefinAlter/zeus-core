[package]
name = "zeus-http"
description = "HTTP probing and segmented fetching for Zeus: parsers, error classification, Prober, SegmentFetcher, and a transport abstraction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["reqwest-transport"]
# The production transport on reqwest + rustls. Off for embedders that bring their own HttpTransport.
reqwest-transport = ["dep:reqwest", "dep:rustls"]

[dependencies]
zeus-types.workspace = true
zeus-control.workspace = true
zeus-session.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytes.workspace = true
futures.workspace = true
async-trait.workspace = true
http.workspace = true
url.workspace = true
httpdate.workspace = true
percent-encoding.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "net", "test-util"] }
axum.workspace = true
proptest.workspace = true

[lints]
workspace = true
